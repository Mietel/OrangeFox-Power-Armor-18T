name: OrangeFox Build

on:
  workflow_dispatch:
    inputs:
      DEVICE_VARIANT:
        description: Device to build
        required: true
        type: choice
        options:
          - 18t
          - 18t-ultra
        default: 18t

permissions:
  contents: read

# Android/OrangeFox builds are too heavy for parallel jobs on the hosted runner.
# A second dispatch waits until the current build finishes.
concurrency:
  group: orangefox-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ALLOW_MISSING_DEPENDENCIES: 'true'
      BUILD_BROKEN_MISSING_REQUIRED_MODULES: 'true'
      BUILD_BROKEN_PLUGIN_VALIDATION: 'true'
      SOONG_ALLOW_MISSING_DEPENDENCIES: 'true'
      FOX_AB_DEVICE: '1'
      OF_FORCE_PREBUILT_KERNEL: '1'
      FOX_VANILLA_BUILD: '1'

    steps:
      - name: Install build dependencies
        run: |
          # Android sources need most of the hosted runner disk. Remove large
          # preinstalled toolchains that are not used by this build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git-lfs lib32ncurses5-dev lib32readline-dev lib32z1-dev libbz2-dev \
            liblz4-tool libncurses5-dev libncurses5 libssl-dev libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev

      - name: Install Java and repo
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Configure swap
        run: |
          if ! swapon --show=NAME | grep -qx '/swapfile-orangefox'; then
            sudo rm -f /swapfile-orangefox
            sudo fallocate -l 8G /swapfile-orangefox
            sudo chmod 600 /swapfile-orangefox
            sudo mkswap /swapfile-orangefox
            sudo swapon /swapfile-orangefox
          fi
          free -h

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize OrangeFox source
        run: |
          mkdir workspace
          cd workspace
          # The current OrangeFox sync script uses this public minimal manifest
          # for the experimental fox_14.1 build system.
          repo init --depth=1 -u https://github.com/nebrassy/platform_manifest_twrp_aosp.git -b twrp-14
          repo sync -j2 --force-sync --no-clone-bundle --no-tags
          df -h .
          rm -rf bootable/recovery vendor/recovery
          git clone --depth=1 -b fox_14.1 https://gitlab.com/OrangeFox/bootable/Recovery.git bootable/recovery
          git clone --depth=1 -b fox_14.1 https://gitlab.com/OrangeFox/vendor/recovery.git vendor/recovery
          mkdir -p external
          git clone --depth=1 -b fox_14.1 https://gitlab.com/OrangeFox/external/se_omapi.git external/se_omapi
          git clone --depth=1 https://android.googlesource.com/platform/external/guava external/guava

      - name: Add device tree
        working-directory: workspace
        env:
          DEVICE_VARIANT: ${{ inputs.DEVICE_VARIANT }}
        run: |
          set -euo pipefail
          case "$DEVICE_VARIANT" in
            18t)
              tree_repo=https://github.com/Mietel/Power_Armor_18T.git
              device_path=device/ulefone/Power_Armor_18T
              product=Power_Armor_18T
              twrp_product=twrp_Power_Armor_18T
              ;;
            18t-ultra)
              tree_repo=https://github.com/Mietel/Power_Armor_18T_Ultra.git
              device_path=device/ulefone/Power_Armor_18T_Ultra
              product=Power_Armor_18T_Ultra
              twrp_product=twrp_Power_Armor_18T_Ultra
              ;;
            *)
              echo "Unsupported device: $DEVICE_VARIANT" >&2
              exit 1
              ;;
          esac

          git clone --depth=1 "$tree_repo" "$device_path"
          test -s "$device_path/prebuilt/kernel"
          test -s "$device_path/prebuilt/dtb.img"

          # This OrangeFox tree provides Soong plugins outside the standard
          # allowlist. The Android build system expects their names in a
          # product or board configuration, not only in the shell environment.
          board_config="$device_path/BoardConfig.mk"
          printf '\nBUILD_BROKEN_PLUGIN_VALIDATION := soong-libaosprecovery_defaults soong-libguitwrp_defaults soong-libminuitwrp_defaults soong-vold_defaults\nBUILD_BROKEN_MISSING_REQUIRED_MODULES := true\nALLOW_MISSING_DEPENDENCIES := true\n' >> "$board_config"

          # Keep the TWRP product base from the minimal manifest and expose
          # an omni product name for the OrangeFox build system.
          sed "s/$twrp_product/omni_$product/g; s/PRODUCT_NAME := twrp_/PRODUCT_NAME := omni_/" \
            "$device_path/$twrp_product.mk" > "$device_path/omni_$product.mk"
          sed -i "s#twrp_$product#omni_$product#g" "$device_path/AndroidProducts.mk"
          sed -i "s/twrp_$product/omni_$product/g" "$device_path/AndroidProducts.mk"

          cat > "$device_path/vendorsetup.sh" <<'EOF'
          export FOX_AB_DEVICE=1
          export FOX_VANILLA_BUILD=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          EOF

          grep -q "omni_$product" "$device_path/AndroidProducts.mk"
          test -f "$device_path/omni_$product.mk"

          {
            echo "DEVICE_PATH=$device_path"
            echo "PRODUCT=$product"
          } >> "$GITHUB_ENV"

      - name: Build OrangeFox image
        working-directory: workspace
        run: |
          set -eo pipefail
          source build/envsetup.sh
          source "$DEVICE_PATH/vendorsetup.sh"
          lunch "omni_$PRODUCT-ap2a-eng"
          mka bootimage -j1 2>&1 | tee "$GITHUB_WORKSPACE/orangefox-build.log"
          output="out/target/product/$PRODUCT/boot.img"
          test -s "$output"
          cp "$output" "$GITHUB_WORKSPACE/OrangeFox-$PRODUCT-boot.img"

      - name: Upload OrangeFox image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ inputs.DEVICE_VARIANT }}
          path: |
            OrangeFox-*.img
            orangefox-build.log
